# Конфігурація A: спільний файл для pg1, pg2, pg3.
# Файл однаковий на всіх вузлах, бо після failover ролі міняються: фоловер стає лідером і навпаки.
# Відмінності вузла задаються окремо:
#   - cluster_name                      — у command сервісу в docker-compose.single.yml;
#   - primary_conninfo, primary_slot_name — у /var/lib/postgresql/node.conf (пише set-upstream.sh);
#   - тимчасові налаштування експериментів — через ALTER SYSTEM (postgresql.auto.conf).

listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 256MB
timezone = 'UTC'
log_timezone = 'UTC'

# ---------- WAL: що саме лідер передає фоловерам ----------
# replica: у WAL достатньо даних для фізичної реплікації (байтові зміни сторінок),
# але немає логічного декодування рядків.
wal_level = replica
# Потрібно для pg_rewind (повернення старого лідера фоловером). У PostgreSQL 18 контрольні суми
# сторінок увімкнені за замовчуванням і цього вже досить, але параметр лишаю явним.
wal_log_hints = on
# fsync лишається увімкненим: інакше порівняння синхронного й асинхронного режимів втрачає сенс.
fsync = on

# ---------- Сторона лідера ----------
# Скільки процесів walsender може працювати одночасно (фоловери + pg_basebackup з -X stream).
max_wal_senders = 10
# Скільки слотів реплікації можна створити. Слот змушує лідера зберігати WAL,
# поки фоловер його не забрав.
max_replication_slots = 10
# Додатковий запас WAL поза слотами не тримаємо: усе утримання дають слоти.
wal_keep_size = 0
# -1 = слот може утримувати скільки завгодно WAL (експеримент 3, досліди 5/10/15 хв).
# Межу для «точки неповернення» виставляє run_exp3_limit.ps1 через ALTER SYSTEM.
max_slot_wal_keep_size = -1
# Через скільки тиші від фоловера лідер закриває з'єднання реплікації.
wal_sender_timeout = 10s

# ---------- Синхронність запису ----------
# on: COMMIT чекає скидання WAL на диск лідера, а якщо задано synchronous_standby_names —
# ще й підтвердження скидання на диск синхронного фоловера.
synchronous_commit = on
# Порожньо = усі фоловери асинхронні. Синхронний режим вмикає run_exp2.ps1:
#   ALTER SYSTEM SET synchronous_standby_names = 'FIRST 1 (pg2)';
synchronous_standby_names = ''

# ---------- Сторона фоловера ----------
# Дозволяє читати з фоловера під час відтворення WAL.
hot_standby = on
# Фоловер не повідомляє лідерові про свої довгі запити (щоб не стримувати VACUUM на лідері).
hot_standby_feedback = off
# Через скільки тиші від лідера фоловер вважає з'єднання втраченим.
wal_receiver_timeout = 10s
# Як часто фоловер звітує лідерові про отриману, записану й відтворену позицію WAL.
wal_receiver_status_interval = 1s
# Пауза між спробами фоловера знову під'єднатися до лідера.
wal_retrieve_retry_interval = 2s
# Штучна затримка відтворення. 0 = немає. Експеримент 1 виставляє 1s через ALTER SYSTEM на pg2.
recovery_min_apply_delay = 0

# ---------- Контрольні точки та архів ----------
# Старі сегменти WAL видаляються саме на контрольній точці; тоді ж слот, що перевищив
# max_slot_wal_keep_size, позначається втраченим.
checkpoint_timeout = 5min
max_wal_size = 1GB
min_wal_size = 80MB
# Архіву WAL немає: якщо лідер видалив сегмент, фоловерові більше нізвідки його взяти.
archive_mode = off

# ---------- Журнал ----------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d %a: '
log_checkpoints = on
# Команди протоколу реплікації (START_REPLICATION, створення слотів) у журналі лідера.
log_replication_commands = on

# Налаштування конкретного вузла (primary_conninfo, primary_slot_name).
# Файл лежить на томі поза каталогом даних, тому pg_basebackup і pg_rewind його не перезаписують.
include_if_exists = '/var/lib/postgresql/node.conf'
