# Конфігурація B: спільний файл для обох лідерів (repb-pg1, repb-pg2).
# cluster_name задається в command сервісу в docker-compose.multi.yml.

listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 256MB
timezone = 'UTC'
log_timezone = 'UTC'

# ---------- WAL: що передається між лідерами ----------
# logical: у WAL є дані для логічного декодування. Плагін pgoutput перетворює WAL на потік
# змін рядків (INSERT/UPDATE/DELETE з ключем і новими значеннями), а не на SQL і не на сторінки.
wal_level = logical
fsync = on
synchronous_commit = on

# Кожна підписка іншого вузла тримає тут один walsender і один логічний слот.
max_wal_senders = 10
max_replication_slots = 10
# Процеси застосування змін на стороні підписника.
max_logical_replication_workers = 4
max_sync_workers_per_subscription = 2

# Час COMMIT кожної транзакції зберігається. Без цього вузол не може помітити,
# що рядок востаннє змінив інший вузол (конфлікти *_origin_differs у журналі PostgreSQL 18).
track_commit_timestamp = on

# Через скільки тиші walsender і apply worker вважають з'єднання втраченим.
wal_sender_timeout = 10s
wal_receiver_timeout = 10s
# Пауза перед повторною спробою apply worker після помилки або розриву.
wal_retrieve_retry_interval = 2s

checkpoint_timeout = 5min
max_wal_size = 1GB
min_wal_size = 80MB
archive_mode = off

# ---------- Журнал ----------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d %a: '
log_checkpoints = on
log_replication_commands = on
