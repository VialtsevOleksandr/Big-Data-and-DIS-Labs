# Власне середовище за вимогами ДЗ
# Для експериментів параметри перевизначаються через spark-submit
spark.master                              local[4]
spark.driver.memory                       2g
spark.executor.memory                     2g
spark.hadoop.fs.local.block.size          33554432
spark.eventLog.enabled                    true
spark.eventLog.dir                        file:///opt/spark-events
spark.eventLog.logBlockUpdates.enabled    true
spark.history.fs.logDirectory             file:///opt/spark-events
spark.history.ui.port                     18080
spark.ui.port                             4040
